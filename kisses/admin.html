<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kisses – Admin</title><link rel="stylesheet" href="style.css"><style>body{background:#fffaf7}.adm{max-width:960px;margin:0 auto;padding:20px}.bar{position:sticky;top:0;background:#fff;z-index:5;padding:10px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 2px 10px #0001}.bar b{margin-right:auto;font-size:18px}.bar button,.bar a,.mini2{background:#5a3a30;color:#fff;border:0;border-radius:99px;padding:8px 16px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none}.bar .alt,.mini2.alt{background:#fff;color:#5a3a30;border:1px solid #5a3a30}.bar .pr{background:#f2806b}.mini2.dg{background:#c0392b}details{background:#fff;border-radius:16px;margin:14px 0;box-shadow:0 4px 14px #5a3a3014}summary{padding:16px 20px;font-weight:700;cursor:pointer;font-size:17px}details>div{padding:0 20px 20px}.f{display:block;margin-top:10px;font-size:12px;font-weight:600}.f input,.f textarea,.f select{width:100%;padding:8px;border:1px solid #e8d5cc;border-radius:10px;font:inherit;font-size:14px;margin-top:3px;color:#5a3a30}.f textarea{min-height:80px}.it{border:1px solid #f0e2db;border-radius:14px;padding:12px;margin-top:12px;background:#fffaf7}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.th{width:80px;height:80px;border-radius:50%;background-size:cover;background-position:center;border:3px solid #fff;box-shadow:0 2px 8px #0003;margin-top:8px}.login{max-width:340px;margin:80px auto;background:#fff;padding:30px;border-radius:22px;box-shadow:0 10px 30px #5a3a3022}.login .btn{width:100%;margin-top:16px;text-align:center}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#5a3a30;color:#fff;padding:10px 20px;border-radius:99px;opacity:0;transition:.3s;z-index:30}.toast.on{opacity:1}.note{font-size:12px;opacity:.7;margin-top:8px}</style></head><body><div id="app"></div><div class="toast" id="toast"></div><script src="seed.js"></script><script src="app.js"></script><script src="admin.js"></script></body></html>
